        function getZoneId(zoneVal) {
            var val = String(zoneVal || '');

            if (val.includes('บริเวณที่ 4(1)') || val.includes('บริเวณที่ ๔ (๑)')) return '4_1';
            if (val.includes('บริเวณที่ 4(2)') || val.includes('บริเวณที่ ๔ (๒)')) return '4_2';
            if (val.includes('บริเวณที่ 4(3)') || val.includes('บริเวณที่ ๔ (๓)')) return '4_3';
            if (val.includes('บริเวณที่ 5') || val.includes('บริเวณที่ ๕')) return '5';

        function formatThaiArea(sqm) {
            var rai = Math.floor(sqm / 1600);
            var remainingSqm = sqm % 1600;
            var ngan = Math.floor(remainingSqm / 400);
            var wah = ((remainingSqm % 400) / 4).toFixed(2);
            return `${rai} ไร่ ${ngan} งาน ${wah} ตร.วา (${sqm.toLocaleString('th-TH', {maximumFractionDigits:2})} ตร.ม.)`;
        }

        function getAdministrativeNames(latlng) {
            var pt = turf.point([latlng.lng, latlng.lat]);
            var tambonName = "-";
            var amphoeName = "-";

            if (typeof json__0 !== 'undefined' && json__0.features) {
                for (var i = 0; i < json__0.features.length; i++) {
                    try {
                        if (turf.booleanPointInPolygon(pt, json__0.features[i])) {
                            var p = json__0.features[i].properties;
                            tambonName = p['TAM_NAM_T'] || p['T_NAMT'] || p['TAMBONG'] || p['TAMBON_T'] || p['T_NAME'] || p['TAM_NAM'] || p['NAME'] || p['TAMBOL_TH'] || "-";
                            break;
                        }
                    } catch(err) {}
                }
            }

            if (typeof json__1 !== 'undefined' && json__1.features) {
                for (var j = 0; j < json__1.features.length; j++) {
                    try {
                        if (turf.booleanPointInPolygon(pt, json__1.features[j])) {
                            var p2 = json__1.features[j].properties;
                            amphoeName = p2['AMP_NAM_T'] || p2['AMPHOE_T'] || p2['A_NAMT'] || p2['AMPHOE'] || p2['A_NAME'] || p2['AMP_NAM'] || p2['AMPHOE_TH'] || p2['NAME'] || "-";
                            break;
                        }
                    } catch(err) {}
                }
            }
            return { tambon: tambonName, amphoe: amphoeName };
        }

        function analyzeAdministrativeIntersection(layerGeoJSON) {
            let intersectedTambons = new Set();
            let intersectedAmphoes = new Set();

            if (typeof json__0 !== 'undefined' && json__0.features) {
                json__0.features.forEach(function(feat) {
                    try {
                        let isHit = false;
                        if (layerGeoJSON.geometry.type === 'Polygon' || layerGeoJSON.geometry.type === 'MultiPolygon') {
                            if (turf.booleanIntersects(layerGeoJSON, feat)) isHit = true;
                        } else if (layerGeoJSON.geometry.type === 'LineString' || layerGeoJSON.geometry.type === 'MultiLineString') {
                            let intersects = turf.lineIntersect(layerGeoJSON, feat);
                            if (intersects.features.length > 0 || turf.booleanIntersects(layerGeoJSON, feat)) isHit = true;
                        } else {
                            if (turf.booleanIntersects(layerGeoJSON, feat)) isHit = true;
                        }

                        if (isHit) {
                            var p = feat.properties;
                            var tName = p['TAM_NAM_T'] || p['T_NAMT'] || p['TAMBONG'] || p['TAMBON_T'] || p['T_NAME'] || p['TAM_NAM'] || p['NAME'] || p['TAMBOL_TH'];
                            if (tName) intersectedTambons.add(tName);
                        }

        function escapeXml(unsafe) {
            return unsafe.replace(/[<>&'"]/g, function (c) {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });
        }

        function exportAllToKML(featureCollection, filename = 'exported_data.kml') {
            if (!featureCollection || !featureCollection.features || featureCollection.features.length === 0) {
                alert('ไม่พบข้อมูลสำหรับส่งออก');
                return;
            }

            let kmlContent = '<?xml version="1.0" encoding="UTF-8"?>\n';
            kmlContent += '<kml xmlns="http://www.opengis.net/kml/2.2">\n';
            kmlContent += '<Document>\n';
            kmlContent += '<name>Exported All Data</name>\n';

            featureCollection.features.forEach((feature, index) => {
                const properties = feature.properties || {};
                const geometry = feature.geometry;
                
                if (!geometry) return;

                const name = properties.name || ('Feature ' + (index + 1));

                kmlContent += '<Placemark>\n';
                kmlContent += `  <name>${escapeXml(name)}</name>\n`;
                
                if (properties.note) {
                    kmlContent += `  <description>${escapeXml(properties.note)}</description>\n`;
                }

                if (geometry.type === 'Point') {
                    const coords = geometry.coordinates;
                    kmlContent += '  <Point>\n';
                    kmlContent += `    <coordinates>${coords[0]},${coords[1]},0</coordinates>\n`;
                    kmlContent += '  </Point>\n';
                } 
                else if (geometry.type === 'LineString') {
                    const coordsStr = geometry.coordinates.map(coord => `${coord[0]},${coord[1]},0`).join(' ');
                    kmlContent += '  <LineString>\n';
                    kmlContent += '    <tessellate>1</tessellate>\n';
                    kmlContent += `    <coordinates>${coordsStr}</coordinates>\n`;
                    kmlContent += '  </LineString>\n';
                }
                else if (geometry.type === 'Polygon') {
                    kmlContent += '  <Polygon>\n';
                    kmlContent += '    <outerBoundaryIs>\n';
                    kmlContent += '      <LinearRing>\n';
                    kmlContent += '        <coordinates>\n';
                    const coordsStr = geometry.coordinates[0].map(coord => `${coord[0]},${coord[1]},0`).join(' ');
                    kmlContent += `          ${coordsStr}\n`;
                    kmlContent += '        </coordinates>\n';
                    kmlContent += '      </LinearRing>\n';
                    kmlContent += '    </outerBoundaryIs>\n';
                    kmlContent += '  </Polygon>\n';
                }
                else if (geometry.type === 'MultiPolygon') {
                    kmlContent += '  <MultiGeometry>\n';
                    geometry.coordinates.forEach(polygonCoords => {
                        kmlContent += '    <Polygon>\n';
                        kmlContent += '      <outerBoundaryIs>\n';
                        kmlContent += '        <LinearRing>\n';
                        kmlContent += '          <coordinates>\n';
                        const coordsStr = polygonCoords[0].map(coord => `${coord[0]},${coord[1]},0`).join(' ');
                        kmlContent += `            ${coordsStr}\n`;
                        kmlContent += '          </coordinates>\n';
                        kmlContent += '        </LinearRing>\n';
                        kmlContent += '      </outerBoundaryIs>\n';
                        kmlContent += '    </Polygon>\n';
                    });
                    kmlContent += '  </MultiGeometry>\n';
                }
                
                kmlContent += '</Placemark>\n';
            });

            kmlContent += '</Document>\n';
            kmlContent += '</kml>';

            const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

                var reader = new FileReader();

                reader.readAsText(file);

            else if (fileName.endsWith('.zip')) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    shp(e.target.result).then(function(geojson) {
                        processImportedGeoJSON(geojson);
